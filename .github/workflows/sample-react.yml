name: 'Build and deploy sample-react via SFTP'

on:
  push:
    paths:
      - 'sample-react/**'  
    branches:
      - main
  workflow_dispatch:

env:
  SOURCE_PATH: 'sample-react'    # Path to project root
  BUILD_PATH: 'sample-react/dist'    # Build output directory
  ARTIFACT_NAME: 'sample-react-dist' # Artifact name
  SFTP_TARGET_DIR: 'apps/sample-react'   # Remote target directory (absolute, no trailing slash)
  NODE_VERSION: '18'             # Node.js version
  BUILD_COMMAND: 'npm run build'      # Build command
  SFTP_PORT: '22'                          # SFTP Port

jobs:
  build:
    name: 'Build sample-react'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          ref: main
      - name: 'Use Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 'Install dependencies'
        working-directory: ${{ env.SOURCE_PATH }}
        run: npm ci
      - name: 'Build project'
        working-directory: ${{ env.SOURCE_PATH }}
        env:
          VITE_BASE_PATH: /apps/sample-react/
          VITE_API_BASE_URL: https://ui-sample-api-net1020251207105113-f3agbrhgfndybwbe.westeurope-01.azurewebsites.net
        run: ${{ env.BUILD_COMMAND }}
      - name: 'Verify build output'
        run: |
          echo "Build output listing:"
          ls -la ${{ env.BUILD_PATH }} || ls -la ${{ env.SOURCE_PATH }}/webapp || true
      - name: 'Upload build artifact'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.BUILD_PATH }}

  deploy-only:
    name: 'Quick deploy (use build artifact)'
    runs-on: ubuntu-latest
    needs: build
    env:
      SFTP_USER: ${{ secrets.SFTP_USER }}
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
    steps:
      - name: 'Download build artifact'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.BUILD_PATH }}
      
      - name: 'Install sshpass'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
      
      - name: 'Deploy files over verified SFTP host'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SFTP_USER" || -z "$SFTP_HOST" || -z "$SFTP_PASSWORD" || -z "$SFTP_KNOWN_HOSTS" ]]; then
            echo "::error::Configure the SFTP_USER, SFTP_HOST, SFTP_PASSWORD, and SFTP_KNOWN_HOSTS GitHub secrets."
            exit 1
          fi

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          SSHPASS="$SFTP_PASSWORD" sshpass -e scp \
            -P "$SFTP_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -r "$BUILD_PATH"/. \
            "$SFTP_USER@$SFTP_HOST:$SFTP_TARGET_DIR/"

      - name: 'Done'
        run: echo "Quick deploy finished."
